services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telecom
      POSTGRES_USER: telecom
      POSTGRES_PASSWORD: telecom_local_only
    ports:
      - "5432:5432"
    volumes:
      - telecom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telecom -d telecom"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/telecom
      SPRING_DATASOURCE_USERNAME: telecom
      SPRING_DATASOURCE_PASSWORD: telecom_local_only
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
volumes:
  telecom_pgdata:
